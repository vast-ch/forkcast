# No third parties: everything the app needs comes from its own origin, so the
# browser blocks any other request (and nothing can be added by accident). Keep
# in step with public/_headers, the same headers for Netlify.
# Inline styles are needed by Leaflet and Ember's style bindings; data: and
# blob: images are the temperature layer and the GPX export.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
# The plan is in the URL: never send it to a linked site.
add_header Referrer-Policy "no-referrer" always;
# No interest-based ad topics from visits here.
add_header Permissions-Policy "browsing-topics=()" always;
add_header X-Content-Type-Options "nosniff" always;
