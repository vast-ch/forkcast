server {
  listen 80;
  root /usr/share/nginx/html;

  # Own routes are kept in the query string, which can be long.
  large_client_header_buffers 4 64k;

  gzip on;
  gzip_types application/json application/javascript application/octet-stream text/css image/svg+xml;
  gzip_min_length 1024;

  # Everything under /assets/ has a content hash in its name: a changed file
  # gets a new name, so these can be cached for a year without going stale.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page itself must always be fresh, so new releases (and their new asset
  # names) are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
