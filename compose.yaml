# Forkcast monorepo.
#   docker compose up ui                  dev server with hot reload (https://ui.forkcast.orb.local)
#   docker compose run --rm data          rebuild all data into data/out (or: data climate|routes|basemap)
#   docker compose --profile prod up --build web   production image (nginx) at https://web.forkcast.orb.local
name: forkcast

services:
  ui:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: base
    init: true
    expose:
      - 4200
    environment:
      - APP_URL=https://ui.forkcast.orb.local
    volumes:
      - ./web:/app
      - /app/node_modules
      # The app imports the built data from /data-out (hashed asset URLs).
      - ./data/out:/app/data-out:ro
    labels:
      - dev.orbstack.domains=ui.forkcast.orb.local
      - dev.orbstack.http-port=4200

  data:
    build:
      context: ./data
    profiles: [tools]
    volumes:
      - ./data/out:/data/out
      - ./data/cache:/data/cache
      - ./data/eurovelo:/data/eurovelo
      - ./data/forkcast_data:/data/forkcast_data
      # For ./check.sh: the tests, and the lint and test settings.
      - ./data/tests:/data/tests
      - ./data/pyproject.toml:/data/pyproject.toml:ro
      - ./data/uv.lock:/data/uv.lock:ro
      # Copernicus CDS key for the ERA5-Land downloads (see data/README.md).
      - ${HOME}/.cdsapirc:/root/.cdsapirc:ro

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: prod
    profiles: [prod]
    expose:
      - 80
    labels:
      - dev.orbstack.domains=web.forkcast.orb.local
      - dev.orbstack.http-port=80
