[project]
name = "forkcast-data"
version = "0.2.0"
description = "Builds Forkcast's climate grid, preset routes and basemap"
requires-python = ">=3.12"
dependencies = [
    "xarray",
    "netCDF4",
    "numpy",
    "cdsapi>=0.7.7",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Pyflakes (unused imports and names, undefined names), pycodestyle errors,
# import order, bugbear (likely bugs) and pyupgrade.
select = ["F", "E", "I", "B", "UP"]
ignore = ["E501"]  # long lines: the build logs are written for reading, not wrapping

[tool.ruff.lint.per-file-ignores]
# Every build fingerprints the source of the modules it depends on, so tidying
# these (import order, typing imports) would force the hours-long climate and
# CRU rebuilds. Leave them until those are rebuilt for a real reason.
"forkcast_data/pipeline.py" = ["UP035"]
"forkcast_data/cru.py" = ["I001"]
"forkcast_data/era5land.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
